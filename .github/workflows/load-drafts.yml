# 생성 지문 draft 적재 + 결과 파일 보관 (1회용)
#
# 지문 초안 생성·AI 검수 workflow 의 결과가 EC2 /tmp 에 남아 있다(artifact 는 이 세션에서
# 내려받을 수 없다). 여기서:
#   1. 운영 DB 백업 (pg_dump -Fc → ~/backups)
#   2. 정답 위치 재배치 (rebalance_answers.py, 결정적)
#   3. draft 로 적재 (load_content.py --status draft, 한 트랜잭션)
#   4. 승인 지문 수가 적재 전후 같은지 확인 — 학생에게 나가는 풀이 바뀌면 실패
#   5. 생성본(재배치 후)·검수 리포트를 저장소에 커밋
# 끝나면 이 파일을 지운다.
name: 생성 지문 draft 적재 (1회용)

on:
  push:
    branches: [schema-first-a28igl]
    paths:
      - .github/workflows/load-drafts.yml

permissions:
  contents: write

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: schema-first-a28igl

      - name: SSH 준비
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2 && chmod 600 ~/.ssh/ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 백업 → 재배치 → draft 적재 → 검증
        run: |
          scp -i ~/.ssh/ec2 -o BatchMode=yes backend/scripts/load_content.py "$EC2_USER@$EC2_HOST:/tmp/load_content_once.py"
          scp -i ~/.ssh/ec2 -o BatchMode=yes backend/scripts/rebalance_answers.py "$EC2_USER@$EC2_HOST:/tmp/rebalance_once.py"
          ssh -i ~/.ssh/ec2 -o BatchMode=yes "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/stripe
          DC="docker compose -f docker-compose.prod.yml"
          test -s /tmp/gen_content.json
          echo "생성본 편수: $(python3 -c 'import json;print(len(json.load(open("/tmp/gen_content.json"))))')"

          TS=$(date -u +%Y%m%dT%H%M%SZ)
          mkdir -p ~/backups
          $DC exec -T postgres pg_dump -U stripe -Fc stripe > ~/backups/stripe_before_draft_load_$TS.dump
          echo "백업: stripe_before_draft_load_$TS.dump ($(du -h ~/backups/stripe_before_draft_load_$TS.dump | cut -f1))"

          C=$($DC ps -q backend)
          docker cp /tmp/load_content_once.py "$C:/app/scripts/load_content_once.py"
          docker cp /tmp/rebalance_once.py "$C:/app/scripts/rebalance_once.py"
          docker cp /tmp/gen_content.json "$C:/tmp/gen_content.json"
          cleanup(){ docker exec "$C" rm -f /app/scripts/load_content_once.py /app/scripts/rebalance_once.py; rm -f /tmp/load_content_once.py /tmp/rebalance_once.py; }
          trap cleanup EXIT

          q(){ $DC exec -T postgres psql -U stripe -d stripe -Atc "$1"; }
          BEFORE=$(q "select count(*) from texts where text_review_status='approved'")
          echo "적재 전 승인 지문: $BEFORE / 전체: $(q 'select count(*) from texts')"

          docker exec "$C" python scripts/rebalance_once.py --file /tmp/gen_content.json --write
          docker exec "$C" python scripts/load_content_once.py --file /tmp/gen_content.json --status draft

          AFTER=$(q "select count(*) from texts where text_review_status='approved'")
          echo "적재 후 승인 지문: $AFTER / 전체: $(q 'select count(*) from texts')"
          q "select text_review_status, grade_group, genre, difficulty_level, count(*) from texts group by 1,2,3,4 order by 1,2,3,4"
          test "$BEFORE" = "$AFTER"

          docker cp "$C:/tmp/gen_content.json" /tmp/gen_content.json
          REMOTE

      - name: 결과 파일 저장소에 보관
        run: |
          scp -i ~/.ssh/ec2 -o BatchMode=yes "$EC2_USER@$EC2_HOST:/tmp/gen_content.json" backend/scripts/generated/draft_20261006.json
          scp -i ~/.ssh/ec2 -o BatchMode=yes "$EC2_USER@$EC2_HOST:/tmp/review.json" backend/scripts/generated/review_20261006.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scripts/generated/draft_20261006.json backend/scripts/generated/review_20261006.json
          git commit -m "content: 생성 지문 초안(draft 적재본)·AI 검수 리포트 보관"
          git push origin HEAD:schema-first-a28igl
