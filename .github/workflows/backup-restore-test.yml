# S3 백업 복원 검증 (1회용)
#
# 백업이 쌓여도 복원이 안 되면 없는 것과 같다. 최신 S3 백업을 EC2 위 **임시**
# Postgres 컨테이너에 복원해 본다. 운영 DB·운영 컨테이너는 건드리지 않는다.
#
# 대조
#   A  S3 최신 백업(03:00 UTC)            — 복원이 되는가, 리비전·행 수
#   B  ~/backups 의 정리 전 덤프(08:27 UTC) — 같은 날 A 와 행 수가 같은가
#   C  운영 DB 현재                        — 진단 8개 테이블 밖은 A 와 같은가
#      (진단 테이블은 08:27 에 비웠으므로 A·B 에만 행이 있어야 정상)
# 값은 찍지 않는다. 테이블별 행 수만.
# 끝나면(성공·실패 무관) 임시 컨테이너와 내려받은 파일을 지운다.
name: 백업 복원 검증

on:
  push:
    branches: [schema-first-a28igl]
    paths:
      - .github/workflows/backup-restore-test.yml

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore latest S3 backup into a throwaway container on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2 && chmod 600 ~/.ssh/ec2
          ssh -q -i ~/.ssh/ec2 -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          B=stripe-db-backups-seoul-333347414948
          T=restore-test-$$
          W=$(mktemp -d)
          cleanup(){ docker rm -f $T >/dev/null 2>&1 || true; rm -rf "$W"; }
          trap cleanup EXIT

          KEY=$(aws s3 ls s3://$B/pg/ | sort | tail -1 | awk '{print $4}')
          echo "S3 최신 백업: $KEY"
          aws s3 cp "s3://$B/pg/$KEY" "$W/a.sql.gz" --only-show-errors
          gzip -t "$W/a.sql.gz" && echo "gzip 무결성: ok ($(du -h "$W/a.sql.gz" | cut -f1))"

          PGDUMP_LOCAL=$(ls -1 ~/backups/stripe_before_schema_first_*.dump | tail -1)
          echo "정리 전 덤프: $(basename "$PGDUMP_LOCAL")"

          docker run -d --name $T --network none -e POSTGRES_PASSWORD=restoretest postgres:16-alpine >/dev/null
          for i in $(seq 1 30); do docker exec $T pg_isready -U postgres -q && break; sleep 1; done
          docker exec $T createdb -U postgres a
          docker exec $T createdb -U postgres b
          # 운영 롤 이름(stripe)이 덤프의 OWNER 에 들어 있다 — 없으면 경고만 나므로 만들어 둔다
          docker exec $T psql -U postgres -qc "CREATE ROLE stripe"

          gunzip -c "$W/a.sql.gz" | docker exec -i $T psql -U postgres -d a -q -v ON_ERROR_STOP=1 >/dev/null
          echo "A 복원: ok"
          docker exec -i $T pg_restore -U postgres -d b --exit-on-error < "$PGDUMP_LOCAL"
          echo "B 복원: ok"

          PG=$(cd ~/stripe && docker compose -f docker-compose.prod.yml ps -q postgres)
          Q="SELECT string_agg(format('%s=%s', t, n), ' ' ORDER BY t) FROM (
               SELECT table_name AS t,
                      (xpath('/row/c/text()', query_to_xml(format('select count(*) as c from %I', table_name), false, true, '')))[1]::text::int AS n
               FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE') s"
          docker exec $T psql -U postgres -d a -Atc "$Q" | tr ' ' '\n' > "$W/a.txt"
          docker exec $T psql -U postgres -d b -Atc "$Q" | tr ' ' '\n' > "$W/b.txt"
          docker exec "$PG" psql -U stripe -d stripe -Atc "$Q" | tr ' ' '\n' > "$W/c.txt"
          echo "A 리비전: $(docker exec $T psql -U postgres -d a -Atc 'select version_num from alembic_version')"
          echo "C 리비전: $(docker exec "$PG" psql -U stripe -d stripe -Atc 'select version_num from alembic_version')"

          echo "== 테이블별 행 수  (A=S3 03:00 · B=정리 전 08:27 · C=운영 현재)"
          join -t= -a1 -a2 -e- -o 0,1.2,2.2 <(sort "$W/a.txt") <(sort "$W/b.txt") > "$W/ab.txt"
          join -t= -a1 -a2 -e- -o 0,1.2,1.3,2.2 "$W/ab.txt" <(sort "$W/c.txt") | awk -F= '{printf "%-24s %6s %6s %6s\n", $1, $2, $3, $4}'

          DIAG="diagnosis_sessions diagnosis_rounds comprehension_results question_responses fluency_results judgment_results prescription_results reports"
          bad=0
          while IFS='=' read -r t n; do
            [ "$t" = "alembic_version" ] && continue
            b=$(grep "^$t=" "$W/b.txt" | cut -d= -f2 || echo -)
            [ "$n" = "$b" ] || { echo "✗ A≠B: $t ($n vs $b)"; bad=1; }
            case " $DIAG " in *" $t "*) continue ;; esac
            c=$(grep "^$t=" "$W/c.txt" | cut -d= -f2 || echo -)
            [ "$n" = "$c" ] || { echo "✗ A≠C (진단 외): $t ($n vs $c)"; bad=1; }
          done < "$W/a.txt"
          [ $bad = 0 ] && echo "대조 결과: 일치" || { echo "대조 결과: 불일치 있음 (위 ✗)"; exit 1; }
          REMOTE
          rm -f ~/.ssh/ec2
