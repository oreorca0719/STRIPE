# 지문·문항 초안 생성 (1회용)
#
# 남은 Claude API 잔액을 텍스트 풀 초안으로 바꾼다(2026-10-06, 예산 종료).
# 키는 운영 서버 .env 에 있는 것을 쓴다 — 저장소·Actions·로그에 키가 나오지 않는다.
# 운영 컨테이너 안에서 생성 스크립트만 돌린다. DB 에는 쓰지 않는다(결과는 JSON 파일).
# 결과는 Actions artifact 로 받아 검토 후 draft 로 적재한다. 끝나면 이 파일을 지운다.
name: 지문 초안 생성 (1회용)

on:
  push:
    branches: [schema-first-a28igl]
    paths:
      - .github/workflows/generate-content.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH 준비
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2 && chmod 600 ~/.ssh/ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: 키 존재 확인 (값은 찍지 않는다)
        run: |
          ssh -i ~/.ssh/ec2 -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            'cd ~/stripe && n=$(docker compose -f docker-compose.prod.yml exec -T backend printenv ANTHROPIC_API_KEY | tr -d "\r\n" | wc -c); echo "키 길이: $n"; test "$n" -gt 20'

      # 배포된 코드보다 이 브랜치의 스크립트가 새것이다(모델 ID·편당 저장).
      # 컨테이너 안에 임시 이름으로 넣는다 — 다음 배포 때 컨테이너와 함께 사라진다.
      - name: 생성 (잔액 소진 시 자동 종료)
        run: |
          scp -i ~/.ssh/ec2 -o BatchMode=yes backend/scripts/generate_content.py "$EC2_USER@$EC2_HOST:/tmp/gen_content_once.py"
          ssh -i ~/.ssh/ec2 -o BatchMode=yes -o ServerAliveInterval=30 "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/stripe
          C=$(docker compose -f docker-compose.prod.yml ps -q backend)
          docker exec "$C" mkdir -p /app/scripts
          docker cp /tmp/gen_content_once.py "$C:/app/scripts/gen_content_once.py"
          docker exec -e PYTHONUNBUFFERED=1 "$C" python scripts/gen_content_once.py \
            --grade-group all --per-combo 15 --topic-offset 4 --out /tmp/gen_content.json || true
          docker cp "$C:/tmp/gen_content.json" /tmp/gen_content.json
          echo "결과 편수: $(python3 -c 'import json;print(len(json.load(open("/tmp/gen_content.json"))))')"
          REMOTE

      - name: 결과 회수
        if: always()
        run: |
          scp -i ~/.ssh/ec2 -o BatchMode=yes "$EC2_USER@$EC2_HOST:/tmp/gen_content.json" gen_content.json || true
          ssh -i ~/.ssh/ec2 -o BatchMode=yes "$EC2_USER@$EC2_HOST" \
            'cd ~/stripe && C=$(docker compose -f docker-compose.prod.yml ps -q backend); docker exec "$C" rm -f /app/scripts/gen_content_once.py; rm -f /tmp/gen_content_once.py' || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gen-content
          path: gen_content.json
          if-no-files-found: warn
          retention-days: 7
