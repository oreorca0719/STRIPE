# schema-first 배포 전 운영 DB 점검 (1회용)
#
# [왜]
# main 병합 → 배포 → start.sh 가 016~022 를 자동 실행한다. 운영 DB 에 새 규칙을
# 통과하지 못하는 행이 있으면 마이그레이션이 실패하고 서버가 뜨지 않는다.
# 병합 전에 backend/scripts/precheck_schema_first.py 로 미리 찾는다.
#
# [하는 일]
# · 러너가 이 브랜치 코드를 받고, SSH tunnel 로 EC2 안의 Postgres 컨테이너에 붙는다.
# · EC2 에는 아무것도 설치·빌드·재시작하지 않는다. 읽는 명령만 보낸다.
# · 점검은 읽기 전용 트랜잭션(SET TRANSACTION READ ONLY)이다.
# · 저장소가 public 이라 로그도 공개다 → --redact: 값은 빼고 id·건수·오류 위치만 찍는다.
#
# 이 브랜치에서 이 파일이나 점검 스크립트가 바뀔 때만 돈다. main 에는 병합하지 않고
# 점검이 끝나면 지운다.
name: 배포 전 점검 — schema-first

on:
  push:
    branches: [schema-first-a28igl]
    paths:
      - .github/workflows/precheck-schema-first.yml
      - backend/scripts/precheck_schema_first.py
      - backend/scripts/apply_schema_first_cleanup.py

concurrency:
  group: precheck-schema-first

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend deps
        working-directory: backend
        run: pip install -q -r requirements.txt

      - name: Open SSH tunnel to production Postgres
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          SSH="ssh -q -i $HOME/.ssh/ec2 -o StrictHostKeyChecking=accept-new -o BatchMode=yes $EC2_USER@$EC2_HOST"

          # 읽기만 한다: 컨테이너 id·IP 조회, 컨테이너 환경변수의 비밀번호 조회
          PG_ID=$($SSH 'cd ~/stripe && docker compose -f docker-compose.prod.yml ps -q postgres')
          test -n "$PG_ID" || { echo "postgres 컨테이너를 찾지 못했다"; exit 1; }
          PG_IP=$($SSH "docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' $PG_ID")
          PG_PW=$($SSH "docker exec $PG_ID printenv POSTGRES_PASSWORD")
          echo "PG_ID=$PG_ID" >> "$GITHUB_ENV"
          echo "::add-mask::$PG_IP"
          echo "::add-mask::$PG_PW"

          $SSH -f -N -o ExitOnForwardFailure=yes -L 15432:$PG_IP:5432
          PW_ENC=$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$PG_PW")
          echo "::add-mask::$PW_ENC"
          echo "DATABASE_URL=postgresql+asyncpg://stripe:${PW_ENC}@127.0.0.1:15432/stripe" >> "$GITHUB_ENV"

      # ── PM 승인(2026-09-26): 진단 8개 테이블 비우기 + interest_topics 불량 3행 NULL(1안) ──
      # 정리 스크립트는 걸리는 행이 id 9·10·14 와 정확히 같을 때만 움직인다. 이미 적용된
      # 뒤 다시 돌면 걸리는 행이 없어 스스로 멈춘다(exit 4) — 그 경우는 실패로 보지 않는다.
      - name: Back up production DB on EC2 (pg_dump, before cleanup)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -q -i $HOME/.ssh/ec2 -o BatchMode=yes $EC2_USER@$EC2_HOST"
          $SSH "set -e; mkdir -p ~/backups; f=~/backups/stripe_before_schema_first_\$(date -u +%Y%m%dT%H%M%SZ).dump; \
                docker exec $PG_ID pg_dump -U stripe -Fc stripe > \$f; \
                n=\$(docker exec -i $PG_ID pg_restore -l < \$f | grep -c 'TABLE DATA'); \
                echo \"backup: \$(basename \$f) \$(du -h \$f | cut -f1), TABLE DATA entries: \$n\"; \
                test \$n -gt 10"

      - name: Cleanup dry-run
        working-directory: backend
        run: |
          set +e
          python scripts/apply_schema_first_cleanup.py --expect-profile-ids 9,10,14
          code=$?
          case $code in 0|4) exit 0 ;; *) exit $code ;; esac

      - name: Cleanup apply
        working-directory: backend
        run: |
          set +e
          python scripts/apply_schema_first_cleanup.py --expect-profile-ids 9,10,14 --confirm
          code=$?
          case $code in 0|4) exit 0 ;; *) exit $code ;; esac

      - name: Run precheck (read-only, redacted)
        working-directory: backend
        env:
          ENV: prod
        run: |
          set +e
          python scripts/precheck_schema_first.py --redact
          code=$?
          echo "precheck exit code: $code  (0 통과 · 1 [유지] 실패 · 2 [진단]만 실패 · 3 전제 불일치)"
          # 결과를 읽는 것이 목적이다. 점검이 불량 행을 찾은 것은 job 실패가 아니다.
          # 접속 실패 등 스크립트 자체 오류(그 밖의 코드)만 실패로 둔다.
          case $code in 0|1|2|3) exit 0 ;; *) exit $code ;; esac

      - name: Close tunnel
        if: always()
        run: |
          pkill -f 'ssh .* -L 15432' || true
          rm -f ~/.ssh/ec2
