# EC2 가 private 저장소를 pull 하도록 deploy key 설정 (1회용)
#
# 저장소를 private 로 바꾼 뒤 EC2 의 익명 https pull 이 막혔다(deploy run 36230198582).
# EC2 에 읽기 전용 SSH 키를 만들고 remote 를 SSH 로 바꾼다. 공개키는 로그로 내보내
# 저장소 Settings → Deploy keys 에 등록한다(쓰기 권한 없이).
# 키가 이미 있으면 새로 만들지 않는다. 비밀키는 EC2 밖으로 나가지 않는다.
name: EC2 deploy key 설정

on:
  push:
    branches: [schema-first-a28igl]
    paths:
      - .github/workflows/ec2-deploy-key.yml

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create key and switch remote on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2 && chmod 600 ~/.ssh/ec2
          ssh -q -i ~/.ssh/ec2 -o StrictHostKeyChecking=accept-new -o BatchMode=yes "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          K=~/.ssh/github_deploy
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if [ ! -f $K ]; then
            ssh-keygen -q -t ed25519 -N "" -C "stripe-ec2-deploy" -f $K
            echo "새 키를 만들었다"
          else
            echo "기존 키를 쓴다"
          fi
          touch ~/.ssh/config && chmod 600 ~/.ssh/config
          if ! grep -q "github_deploy" ~/.ssh/config; then
            printf '\nHost github.com\n  HostName github.com\n  User git\n  IdentityFile %s\n  IdentitiesOnly yes\n' "$K" >> ~/.ssh/config
          fi
          # GitHub 공개 ed25519 호스트 키 지문과 대조한 뒤에만 known_hosts 에 넣는다
          ssh-keyscan -t ed25519 github.com 2>/dev/null > /tmp/gh_hostkey
          FP=$(ssh-keygen -lf /tmp/gh_hostkey | awk '{print $2}')
          test "$FP" = "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU" || { echo "github.com 호스트 키 지문 불일치: $FP"; exit 1; }
          grep -qF "$(cut -d' ' -f2- /tmp/gh_hostkey)" ~/.ssh/known_hosts 2>/dev/null || cat /tmp/gh_hostkey >> ~/.ssh/known_hosts
          cd ~/stripe
          echo "remote 변경 전: $(git remote get-url origin)"
          git remote set-url origin git@github.com:oreorca0719/STRIPE.git
          echo "remote 변경 후: $(git remote get-url origin)"
          echo "===== 아래 공개키를 Settings → Deploy keys 에 등록 (Allow write access 체크하지 않음) ====="
          cat $K.pub
          echo "====="
          echo "현재 배포된 커밋: $(git log --oneline -1)"
          if git ls-remote origin -h refs/heads/main >/dev/null 2>&1; then echo "GitHub 접근: 이미 됨"; else echo "GitHub 접근: 아직 안 됨 (키 등록 필요)"; fi
          REMOTE
          rm -f ~/.ssh/ec2
