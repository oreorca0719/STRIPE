<!DOCTYPE html>
<!--
  STRIPE 모듈 흐름 대시보드 — 로컬 개발 전용

  [설계 이력]
  1차: 연결선 라벨을 전부 선 위에 그렸다 → 22/23개가 노드 위에 얹혔다.
  2차: 세로 열 배치 → 선이 노드 한 점으로 모여 끝에서 겹쳤다.
  3차: CSS 그리드에 묶음을 놓고 규칙으로 선을 그었다 → 박스는 안 뚫었으나
       폭 2139px, 나란한 선이 한 줄로 보였고, 라벨은 마우스를 올려야만 보였다.
       브라우저가 정한 좌표 위에 규칙을 얹는 방식으로는 겹침을 통제할 수 없다.
  4차(지금): **좌표를 전부 손으로 정한다.** 블록 위치(NODE)와 선 경로·라벨
       자리(ROUTE)를 표로 적고, 그린 뒤 audit() 가 원칙 위반을 센다.

  [PM 원칙 — audit() 가 검사한다]
  1. 선은 출발·도착 지점 외에서 서로 겹치지 않는다. 교차는 허용하되 최소화.
  2. 선 라벨끼리 충분히 떨어진다. 라벨이 선·블록을 덮지 않는다.
  3. 전체 흐름이 페이지에서 가장 크다.

  값은 기록·표시되지 않는다. 타입·개수·키·enum 까지만.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>STRIPE 흐름</title>
<style>
  :root{
    --bg:#0f1117; --panel:#1a1d27; --line:#2a2d3e; --txt:#e6e8ef; --dim:#8b90a3;
    --mint:#4ECDC4; --coral:#FF6B6B; --yellow:#FFE66D; --violet:#9b8cff;
    --font:"Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 var(--font)}
  header{display:flex;align-items:center;gap:.7rem;padding:.75rem 1.1rem;
         border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:1rem}
  .live{font-size:.72rem;padding:.13rem .48rem;border-radius:99px;background:#23283a;color:var(--dim)}
  .live.on{background:rgba(78,205,196,.15);color:var(--mint)}
  .btn{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;
       padding:.2rem .55rem;font:inherit;font-size:.74rem;cursor:pointer}
  .btn:hover{color:var(--txt)} .btn.on{border-color:var(--mint);color:var(--mint)}
  main{padding:.85rem 1.1rem}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.8rem}
  .card+.card{margin-top:.85rem}
  .card h2{margin:.05rem 0 .5rem;font-size:.76rem;color:var(--dim);letter-spacing:.7px;text-transform:uppercase}

  /* 기능 버튼 — 흐름도 위에 가로로 둔다. 세로 공간은 흐름도 몫이다. */
  #featlist{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.6rem}
  .feat{background:#141822;border:1px solid var(--line);color:var(--txt);border-radius:99px;
        padding:.26rem .7rem;cursor:pointer;font:inherit;font-size:.8rem;white-space:nowrap}
  .feat:hover{background:#23283a}
  .feat small{color:var(--dim);font-size:.7rem;margin-left:.3rem}
  .feat.sel{background:rgba(78,205,196,.12);border-color:var(--mint);color:var(--mint)}
  .feat.sel small{color:#79b8b2}
  .hintbar{font-size:.74rem;color:#6d7288;margin-bottom:.4rem}

  /* ── 흐름도 (SVG 한 장) ─────────────────────────────────── */
  #canvas{overflow-x:auto}
  #map{display:block;width:100%;min-width:1150px;max-width:1700px;height:auto;margin:0 auto}
  #map text{font-family:var(--font)}
  .gbox{fill:#12151d;stroke:#333a4d;stroke-width:1}
  .grp.lit .gbox{stroke:var(--mint);stroke-width:2;filter:drop-shadow(0 0 5px rgba(78,205,196,.6))}
  .grp.dim{opacity:.35}
  .gtbg{fill:#12151d} .gt{fill:#7d8399;font-size:11px;letter-spacing:1px}
  .grp.lit .gt{fill:var(--mint)}

  .node{cursor:pointer}
  .nbox{fill:#181d28;stroke:#2b3040;stroke-width:1.5;transition:stroke .12s,fill .12s}
  .node:hover .nbox{stroke:#5b6280}
  .ntx{fill:var(--txt);font-size:12.5px}
  .node.dim{opacity:.25}
  .node.inscope .nbox{stroke:var(--mint);fill:#16302f}
  .node.fired .nbox{stroke:var(--yellow);fill:#2e2c1c}
  .node.pinned .nbox{stroke-width:3}
  .pur.pure{fill:var(--mint)} .pur.mixed{fill:var(--yellow)} .pur.db{fill:var(--coral)}
  .cnt circle{fill:var(--yellow)} .cnt text{fill:#20242e;font-size:10px;font-weight:800}

  .ln{fill:none;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
  .ln.fixed{stroke:#56617f}
  .ln.undefined{stroke:#8a7ce0;stroke-dasharray:7 4}
  .ln.mismatch{stroke:#d06a6a;stroke-dasharray:4 3}
  .ln.hot{stroke:var(--yellow);stroke-width:2.6}
  .ln.on{stroke-width:2.8} .ln.on.fixed{stroke:var(--mint)}
  .ln.on.undefined{stroke:var(--violet)} .ln.on.mismatch{stroke:var(--coral)}
  .ln.faded{opacity:.1}

  .lab rect{fill:#0f1117;stroke:#262a38;stroke-width:1}
  .lab text{fill:#c3c9da;font-size:11.5px}
  .lab.on rect{stroke:var(--mint)} .lab.on text{fill:#fff}
  .lab.faded{opacity:.12}

  .legend{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.72rem;color:var(--dim);
          margin-top:.55rem;padding-top:.5rem;border-top:1px solid var(--line)}
  .legend i{display:inline-block;width:16px;height:0;border-top-width:2px;border-top-style:solid;
            margin-right:4px;vertical-align:3px}
  .purity{display:inline-block;width:7px;height:7px;border-radius:99px;margin-right:5px}
  .purity.pure{background:var(--mint)} .purity.mixed{background:var(--yellow)} .purity.db{background:var(--coral)}

  table{width:100%;border-collapse:collapse;font-size:.79rem}
  th{text-align:left;font-weight:600;color:var(--dim);font-size:.71rem;padding:.3rem .45rem;
     border-bottom:1px solid var(--line);white-space:nowrap}
  td{padding:.32rem .45rem;border-bottom:1px solid #20242f;vertical-align:top}
  tr.row{cursor:pointer} tr.row:hover td{background:#20242f}
  tr.row.faded{opacity:.3} tr.row.lit td{background:rgba(78,205,196,.09)}
  .arrow{color:#5a6178;padding:0 .2rem}
  .pay{font-family:ui-monospace,Consolas,monospace;font-size:.74rem}
  .st{font-size:.68rem;padding:.06rem .4rem;border-radius:99px;white-space:nowrap}
  .st.fixed{background:#242a38;color:#8b90a3}
  .st.undefined{background:rgba(155,140,255,.16);color:#b3a7ff}
  .st.mismatch{background:rgba(255,107,107,.16);color:#ff9b9b}
  .note{font-size:.71rem;color:var(--dim)}

  .traces{display:flex;gap:.32rem;flex-wrap:wrap;margin-bottom:.55rem}
  .tchip{font-size:.71rem;padding:.18rem .5rem;border-radius:99px;cursor:pointer;
         border:1px solid var(--line);background:#141822;color:var(--dim)}
  .tchip.sel{border-color:var(--mint);color:var(--mint)} .tchip.nil{opacity:.4}
  .ev{border-left:2px solid var(--line);padding:.24rem 0 .24rem .6rem}
  .ev-h{font-family:ui-monospace,Consolas,monospace;font-size:.76rem}
  .ev-h .m{color:var(--mint)} .ev-h .ms{color:#6d7288;font-size:.7rem} .ev-h .err{color:var(--coral)}
  .io{font-family:ui-monospace,Consolas,monospace;font-size:.71rem;color:var(--dim);word-break:break-all}
  .io b{color:#b9c0d4}
  .empty{color:var(--dim);font-size:.78rem;padding:.4rem 0}
  .sub2{font-size:.72rem;color:var(--dim);margin-bottom:.45rem}
</style>
</head>
<body>
<header>
  <h1>STRIPE 모듈 흐름</h1>
  <span id="live" class="live">연결 중…</span>
  <span style="flex:1"></span>
  <button class="btn" id="btnOral" onclick="toggleOral()">음독 숨김</button>
  <button class="btn" onclick="reset()">전체 보기</button>
  <button class="btn" onclick="clearTraces()">기록 비우기</button>
</header>

<main>
  <div class="card">
    <h2 id="maptitle">전체 흐름</h2>
    <div id="featlist"></div>
    <div class="hintbar" id="hint">모듈에 마우스를 올리면 그 모듈의 입력·출력만 강조됩니다. 누르면 고정됩니다.</div>
    <div id="canvas"><svg id="map" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="legend">
      <span><span class="purity pure"></span>순수 변환</span>
      <span><span class="purity mixed"></span>혼재</span>
      <span><span class="purity db"></span>DB 전담</span>
      <span><i style="border-color:#56617f"></i>형식 확정</span>
      <span><i style="border-color:#8a7ce0;border-top-style:dashed"></i>형식 미정</span>
      <span><i style="border-color:#d06a6a;border-top-style:dashed"></i>두 곳이 다름</span>
      <span><i style="border-color:#FFE66D"></i>방금 실행됨</span>
    </div>
  </div>

  <div class="card">
    <h2>연결 목록 <span id="edgecount" style="color:#6d7288"></span></h2>
    <table><thead><tr>
      <th>보내는 쪽</th><th></th><th>받는 쪽</th><th>오가는 것</th><th>형식</th><th>형식 정의</th><th>비고</th>
    </tr></thead><tbody id="edgerows"></tbody></table>
  </div>

  <div class="card">
    <h2>실행 기록</h2>
    <div class="sub2">값은 기록하지 않습니다 — 타입·개수·키·enum 까지만.<span id="tmeta"></span></div>
    <div id="traces" class="traces"></div>
    <div id="events"><div class="empty">아직 요청이 없습니다. 로컬에서 진단을 실행하면 흐름이 쌓입니다.</div></div>
  </div>
</main>

<script>
/* ════════════════════════════════════════════════════════════════════
   배치표 — 손으로 정한 좌표. 논리 좌표계 W×H, 화면 폭에 맞춰 확대·축소된다.

   NODE[key]  = [x, y, 폭]      블록 높이는 NH 로 고정
   ROUTE[a>b] = { s:[변, 좌표], d:[변, 좌표], v:[꺾는 좌표…], lab:{…} }
     변: t 위 · b 아래 · l 왼 · r 오른.  좌표는 그 변 위의 절대 위치.
     v : 출발 방향으로 나가 v[0] 에서 꺾고, 직각으로 v[1] 에서 꺾고…
         남은 구간은 도착 변에 맞춰 자동으로 잇는다.
     lab: seg = 라벨을 붙일 구간 번호, side = 그 구간의 어느 쪽,
          at = 구간 위 위치(생략 시 가운데)

   레지스트리에 모듈·연결이 새로 생기면 여기에도 적어야 한다.
   빠지면 tests/test_flow_registry.py 가 실패한다.
   ════════════════════════════════════════════════════════════════════ */
const W=1440, H=1290, NH=44;
const NODE={
  'survey.definition':        [  80,  80, 190],
  'survey.reader_type':       [  80, 220, 190],
  'content.topic_tags':       [ 655,  80, 170],
  'content.readability':      [ 880,  80, 170],
  'content.item_quality':     [1100,  80, 170],
  'diagnosis.text_selection': [ 500, 340, 420],
  'diagnosis.attention':      [ 250, 520, 170],
  'diagnosis.scoring':        [ 620, 520, 180],
  'diagnosis.adaptive':       [ 940, 520, 170],
  'diagnosis.judgment':       [ 620, 740, 180],
  'diagnosis.pipeline':       [1000, 740, 180],
  'diagnosis.environment':    [ 960, 960, 170],
  'diagnosis.prescription':   [1180, 960, 170],
  'diagnosis.book_recommend': [1180,1200, 170],
  'diagnosis.report':         [ 620,1200, 260],
  'stt.adapter':              [ 100, 910, 150],
  'stt.analyzer':             [ 390, 910, 160],
  'stt.clova':                [ 100,1020, 130],
  'stt.mock':                 [ 250,1020, 130],
  'stt.vad':                  [ 410,1020, 140],
  'legal':                    [ 100,1200, 160],
  'user_service':             [ 290,1200, 160],
};
const ROUTE={
  'survey.definition>survey.reader_type':
    {s:['b',130], d:['t',130], lab:{seg:0, side:'right'}},
  'survey.reader_type>diagnosis.text_selection':
    {s:['r',242], d:['t',550], lab:{seg:0, side:'above'}},
  'survey.definition>diagnosis.text_selection':
    {s:['r',102], d:['t',610], lab:{seg:0, side:'above'}},
  'content.topic_tags>diagnosis.text_selection':
    {s:['b',740], d:['t',740], lab:{seg:0, side:'right', at:167}},
  'content.readability>diagnosis.text_selection':
    {s:['b',965], d:['t',830], v:[210], lab:{seg:0, side:'right', at:167}},
  'content.item_quality>diagnosis.text_selection':
    {s:['b',1185], d:['t',890], v:[264], lab:{seg:1, side:'below', at:1040}},
  'diagnosis.text_selection>diagnosis.scoring':
    {s:['b',710], d:['t',710], lab:{seg:0, side:'right'}},
  'diagnosis.text_selection>diagnosis.attention':
    {s:['l',362], d:['t',335], lab:{seg:0, side:'above', at:405}},
  'stt.adapter>stt.analyzer':
    {s:['r',932], d:['l',932], lab:{seg:0, side:'above'}},
  'stt.vad>stt.analyzer':
    {s:['t',480], d:['b',480], lab:{seg:0, side:'left'}},
  'diagnosis.scoring>diagnosis.adaptive':
    {s:['r',542], d:['l',542], lab:{seg:0, side:'above'}},
  'diagnosis.scoring>diagnosis.judgment':
    {s:['b',710], d:['t',710], lab:{seg:0, side:'right'}},
  'diagnosis.attention>diagnosis.judgment':
    {s:['b',335], d:['t',650], v:[680], lab:{seg:1, side:'above'}},
  'stt.analyzer>diagnosis.judgment':
    {s:['t',500], d:['b',660], v:[840], lab:{seg:1, side:'below'}},
  'survey.definition>diagnosis.judgment':
    {s:['l',102], d:['l',762], v:[40], lab:{seg:2, side:'above', at:330}},
  'diagnosis.judgment>diagnosis.pipeline':
    {s:['r',774], d:['l',774], lab:{seg:0, side:'above'}},   // 두 줄 라벨이 박스 윗변에 안 닿게 낮춘다
  'diagnosis.pipeline>diagnosis.prescription':
    {s:['r',762], d:['t',1265], lab:{seg:1, side:'left', at:850}},
  'diagnosis.pipeline>diagnosis.environment':
    {s:['b',1045], d:['t',1045], lab:{seg:0, side:'left', at:850}},
  'diagnosis.prescription>diagnosis.text_selection':
    {s:['r',982], d:['r',362], v:[1400], lab:{seg:2, side:'above', at:1160}},
  'diagnosis.prescription>diagnosis.report':
    {s:['b',1210], d:['t',830], v:[1140], lab:{seg:1, side:'below', at:1060}},
  'diagnosis.environment>diagnosis.report':
    {s:['b',1045], d:['t',770], v:[1100], lab:{seg:1, side:'above', at:860}},
  'diagnosis.prescription>diagnosis.book_recommend':
    {s:['b',1265], d:['t',1265], lab:{seg:0, side:'right', at:1100, max:80}},
  'diagnosis.judgment>diagnosis.report':
    {s:['b',710], d:['t',710], lab:{seg:0, side:'left', at:930, max:110}},
};
/* 음독 모듈은 레지스트리상 '측정' 묶음이지만, 비활성이라 따로 묶어 둔다.
   같은 박스에 넣으면 측정 박스가 판정 줄까지 늘어나 다른 선을 덮는다. */
const ORAL=new Set(['stt.adapter','stt.clova','stt.mock','stt.vad','stt.analyzer']);
const ORAL_GROUP='음독 (비활성)';

/* 원칙 검사의 여유값 (논리 px) */
const GAP={ lineLine:14, labLab:10, labLine:5, labNode:8, lineNode:10, lineBox:10, port:24 };

/* ════════════════════════════════════════════════════════════════════ */
let REG=null, TRACES=[], selFeature=null, selTrace=null;
let hoverMod=null, pinMod=null, hoverEdge=null, hideOral=true;
let GEO=null;   // 마지막으로 그린 도형 — applyState 와 audit 가 쓴다
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
/* DOM id 로 쓸 안전한 문자열. 한글을 지우면 '입력'·'콘텐츠'가 둘 다 '_' 뭉치가
   되어 id 가 충돌한다(실제로 겪었다). 문자 코드로 바꾼다. */
const cid=(k)=>String(k).split('').map(c=>
  /[A-Za-z0-9]/.test(c) ? c : 'x'+c.charCodeAt(0).toString(36)).join('');
const ekey=(e)=>e.src+'>'+e.dst;

async function boot(){
  REG=await (await fetch('registry')).json();
  drawFeatures(); build(); drawEdgeTable(); connect();
}

/* ── 상태 ─────────────────────────────────────────────────── */
const shown=(k)=>!(hideOral&&ORAL.has(k));
const featSet=()=>{ const f=REG.features.find(x=>x.key===selFeature); return f?new Set(f.modules):null; };
const activeTrace=()=> selTrace?TRACES.find(x=>x.id===selTrace)
                              :(TRACES.find(t=>t.events.length)||TRACES[0]);
function firedMap(){ const t=activeTrace(), m=new Map();
  if(t) for(const e of t.events) m.set(e.module,(m.get(e.module)||0)+1); return m; }
const focusMod=()=>pinMod||hoverMod;
function neighborSet(){ const k=focusMod(); if(!k) return null;
  const s=new Set([k]);
  for(const e of REG.edges){ if(e.src===k) s.add(e.dst); if(e.dst===k) s.add(e.src); }
  return s; }
const label=(k)=>(REG.modules.find(m=>m.key===k)||{}).label||k;
const dgroup=(m)=>ORAL.has(m.key)?ORAL_GROUP:m.group;

/* ── 기하 ─────────────────────────────────────────────────── */
const rectOf=(k)=>{ const [x,y,w]=NODE[k]; return {x,y,w,h:NH}; };
function port(k,side,c){ const r=rectOf(k);
  return side==='t'?[c,r.y]:side==='b'?[c,r.y+r.h]:side==='l'?[r.x,c]:[r.x+r.w,c]; }
function routePts(e){
  const R=ROUTE[ekey(e)];
  const S=port(e.src,...R.s), E=port(e.dst,...R.d);
  let axis=(R.s[0]==='t'||R.s[0]==='b')?'v':'h', cur=S; const pts=[S];
  for(const t of (R.v||[])){ cur=axis==='v'?[cur[0],t]:[t,cur[1]]; pts.push(cur); axis=axis==='v'?'h':'v'; }
  const endAxis=(R.d[0]==='t'||R.d[0]==='b')?'v':'h';
  if(axis!==endAxis) pts.push(axis==='h'?[E[0],cur[1]]:[cur[0],E[1]]);
  pts.push(E);
  return pts.filter((p,i)=>!i||p[0]!==pts[i-1][0]||p[1]!==pts[i-1][1]);
}
const segsOf=(pts)=>pts.slice(1).map((p,i)=>({a:pts[i],b:p,
  h:pts[i][1]===p[1], v:pts[i][0]===p[0]}));

/* 라벨: 긴 것은 ' · ' ' + ' ' (' 에서 끊어 여러 줄로. 폭은 실제 글꼴로 잰다. */
const _ctx=document.createElement('canvas').getContext('2d');
function tw(s,px=11.5){ _ctx.font=`${px}px "Segoe UI",system-ui,sans-serif`; return _ctx.measureText(s).width; }
function wrap(t,max=150){
  const parts=t.split(/(?<= · )|(?<= \+ )|(?= \()/).map(s=>s.trim()).filter(Boolean);
  const lines=[];
  for(const p of parts){
    const last=lines[lines.length-1];
    if(last!==undefined && tw(last+' '+p)<=max) lines[lines.length-1]=last+' '+p;
    else lines.push(p);
  }
  return lines;
}
const LH=14, PADX=5, PADY=3, OFF=8;
function placeLabel(pts,spec,text){
  const lines=wrap(text,spec.max);
  const w=Math.max(...lines.map(l=>tw(l)))+PADX*2, h=lines.length*LH+PADY*2;
  const s=segsOf(pts)[spec.seg];
  let x,y,anchor='middle';
  if(s.h){ const y0=s.a[1], cx=spec.at??(s.a[0]+s.b[0])/2;
    x=cx-w/2; y=spec.side==='above'?y0-OFF-h:y0+OFF; }
  else { const x0=s.a[0], cy=spec.at??(s.a[1]+s.b[1])/2;
    y=cy-h/2; if(spec.side==='left'){ x=x0-OFF-w; anchor='end'; } else { x=x0+OFF; anchor='start'; } }
  return {x,y,w,h,lines,anchor};
}

/* ── 그리기 ───────────────────────────────────────────────── */
function build(){
  const mods=REG.modules.filter(m=>shown(m.key));
  const missingN=mods.filter(m=>!NODE[m.key]).map(m=>m.key);
  const edges=REG.edges.filter(e=>shown(e.src)&&shown(e.dst)&&NODE[e.src]&&NODE[e.dst]);
  const missingR=edges.filter(e=>!ROUTE[ekey(e)]).map(ekey);
  const placed=mods.filter(m=>NODE[m.key]);

  // 묶음 박스 = 소속 블록을 감싸는 사각형 + 여백
  const groups={};
  for(const m of placed){ const g=dgroup(m), r=rectOf(m.key);
    const b=groups[g]||(groups[g]={x1:1e9,y1:1e9,x2:-1e9,y2:-1e9,mods:[]});
    b.x1=Math.min(b.x1,r.x); b.y1=Math.min(b.y1,r.y); b.x2=Math.max(b.x2,r.x+r.w); b.y2=Math.max(b.y2,r.y+r.h);
    b.mods.push(m.key); }
  const PAD=20;
  for(const g in groups){ const b=groups[g];
    Object.assign(b,{x:b.x1-PAD,y:b.y1-PAD,w:b.x2-b.x1+PAD*2,h:b.y2-b.y1+PAD*2});
    const tws=tw(g,11)+g.length*1+10;
    b.title={x:b.x+10,y:b.y-8,w:tws,h:16}; }

  const E=edges.filter(e=>ROUTE[ekey(e)]).map((e,i)=>{
    const pts=routePts(e), R=ROUTE[ekey(e)];
    return {e,i,pts,segs:segsOf(pts),lab:placeLabel(pts,R.lab,e.payload)};
  });
  GEO={mods:placed,groups,E};

  const mk=(id,c)=>`<marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9"
     markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="${c}"/></marker>`;
  const out=[`<defs>${mk('a','#6b7697')}${mk('ao','#4ECDC4')}${mk('ah','#FFE66D')}${mk('au','#8a7ce0')}${mk('am','#d06a6a')}</defs>`];

  for(const g in groups){ const b=groups[g], t=b.title;
    out.push(`<g class="grp" id="g-${cid(g)}">
      <rect class="gbox" x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" rx="12"/>
      <rect class="gtbg" x="${t.x}" y="${t.y}" width="${t.w}" height="${t.h}"/>
      <text class="gt" x="${t.x+5}" y="${t.y+12}">${esc(g)}</text></g>`); }

  for(const m of placed){ const r=rectOf(m.key);
    out.push(`<g class="node" id="n-${cid(m.key)}" data-k="${esc(m.key)}">
      <title>${esc(m.key)}</title>
      <rect class="nbox" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="8"/>
      <circle class="pur ${m.purity}" cx="${r.x+14}" cy="${r.y+r.h/2}" r="3.5"/>
      <text class="ntx" x="${r.x+24}" y="${r.y+r.h/2+4.5}">${esc(m.label)}</text>
      <g class="cnt" style="display:none"><circle cx="${r.x+r.w-2}" cy="${r.y+2}" r="9"/>
        <text x="${r.x+r.w-2}" y="${r.y+5.5}" text-anchor="middle"></text></g></g>`); }

  for(const x of E) out.push(`<path class="ln ${x.e.status}" id="e-${x.i}" d="${path(x.pts)}"/>`);

  for(const x of E){ const L=x.lab;
    const tx=L.anchor==='start'?L.x+PADX:L.anchor==='end'?L.x+L.w-PADX:L.x+L.w/2;
    out.push(`<g class="lab" id="l-${x.i}"><rect x="${L.x}" y="${L.y}" width="${L.w}" height="${L.h}" rx="4"/>`
      + L.lines.map((s,j)=>`<text x="${tx}" y="${L.y+PADY+11+j*LH}" text-anchor="${L.anchor}">${esc(s)}</text>`).join('')
      + `</g>`); }

  const svg=$('map');
  svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  svg.innerHTML=out.join('');
  svg.querySelectorAll('.node').forEach(n=>{
    const k=n.dataset.k;
    n.addEventListener('mouseenter',()=>setHover(k));
    n.addEventListener('mouseleave',()=>setHover(null));
    n.addEventListener('click',()=>togglePin(k));
  });
  applyState();
  audit(missingN,missingR);
}

/** 꺾인 점들을 모서리만 둥글게 잇는다 */
function path(pts,r=10){
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=1;i<pts.length-1;i++){
    const [px,py]=pts[i-1],[cx,cy]=pts[i],[nx,ny]=pts[i+1];
    const d1=Math.hypot(cx-px,cy-py)||1, d2=Math.hypot(nx-cx,ny-cy)||1;
    const rr=Math.min(r,d1/2,d2/2);
    d+=` L${cx+(px-cx)/d1*rr},${cy+(py-cy)/d1*rr} Q${cx},${cy} ${cx+(nx-cx)/d2*rr},${cy+(ny-cy)/d2*rr}`;
  }
  const e=pts[pts.length-1]; return d+` L${e[0]},${e[1]}`;
}

/* 강조 상태만 바꾼다 — 도형은 다시 그리지 않는다(마우스 이벤트가 끊기지 않게). */
function applyState(){
  if(!GEO) return;
  const feat=featSet(), fired=firedMap(), nb=neighborSet(), fk=focusMod();
  for(const m of GEO.mods){ const el=$('n-'+cid(m.key)); if(!el) continue;
    const dim=nb?!nb.has(m.key):(feat?!feat.has(m.key):false);
    el.classList.toggle('dim',dim);
    el.classList.toggle('inscope',!!(feat&&feat.has(m.key)));
    el.classList.toggle('fired',fired.has(m.key));
    el.classList.toggle('pinned',m.key===pinMod);
    const c=el.querySelector('.cnt'), n=fired.get(m.key);
    c.style.display=n?'':'none'; c.querySelector('text').textContent=n||''; }
  for(const g in GEO.groups){ const el=$('g-'+cid(g)); if(!el) continue;
    const any=GEO.groups[g].mods.some(k=>feat&&feat.has(k));
    el.classList.toggle('lit',any); el.classList.toggle('dim',!!feat&&!any); }
  for(const x of GEO.E){ const e=x.e, p=$('e-'+x.i), l=$('l-'+x.i);
    const touches=fk&&(e.src===fk||e.dst===fk);
    const on=touches||hoverEdge===ekey(e)||(!fk&&feat&&feat.has(e.src)&&feat.has(e.dst));
    const hot=fired.has(e.src)&&fired.has(e.dst);
    const off=(fk&&!touches)||(!fk&&feat&&!(feat.has(e.src)&&feat.has(e.dst)));
    p.setAttribute('class',['ln',e.status,on?'on':'',hot&&!on?'hot':'',off?'faded':''].filter(Boolean).join(' '));
    const mk=on?'ao':hot?'ah':e.status==='undefined'?'au':e.status==='mismatch'?'am':'a';
    p.setAttribute('marker-end',`url(#${mk})`);
    l.setAttribute('class',['lab',on?'on':'',off?'faded':''].filter(Boolean).join(' ')); }
}
function setHover(k){ if(pinMod) return; hoverMod=k; applyState(); drawEdgeTable(); }
function togglePin(k){
  pinMod=(pinMod===k)?null:k; hoverMod=null;
  $('hint').textContent=pinMod?`${label(pinMod)} 의 입력·출력만 표시합니다. 다시 누르면 해제됩니다.`
                              :'모듈에 마우스를 올리면 그 모듈의 입력·출력만 강조됩니다. 누르면 고정됩니다.';
  applyState(); drawEdgeTable();
}

/* ── 원칙 검사 ───────────────────────────────────────────────
   그린 도형을 그대로 재서 위반을 센다. 숫자가 0 이어도 눈으로 다시 본다 —
   3차 때 "박스 관통 0" 이었지만 화면은 나빴다. */
function audit(missingN,missingR){
  const {mods,groups,E}=GEO, bad=[];
  const R=(r,m=0)=>({x1:r.x-m,y1:r.y-m,x2:r.x+r.w+m,y2:r.y+r.h+m});
  const hit=(a,b)=>a.x1<b.x2&&b.x1<a.x2&&a.y1<b.y2&&b.y1<a.y2;
  const segBox=(s)=>({x1:Math.min(s.a[0],s.b[0]),x2:Math.max(s.a[0],s.b[0]),
                      y1:Math.min(s.a[1],s.b[1]),y2:Math.max(s.a[1],s.b[1])});
  const grow=(b,m)=>({x1:b.x1-m,y1:b.y1-m,x2:b.x2+m,y2:b.y2+m});
  const nm=(x)=>`${label(x.e.src)}→${label(x.e.dst)}`;
  let overlap=0, cross=0, labGap=0, labHit=0, lineHit=0, port=0, other=0;

  // 1. 선끼리 — 겹침(나란히 붙음 포함)과 교차
  for(let i=0;i<E.length;i++) for(let j=i+1;j<E.length;j++)
    for(const s of E[i].segs) for(const t of E[j].segs){
      const A=segBox(s), B=segBox(t);
      if(s.h&&t.h&&Math.abs(A.y1-B.y1)<GAP.lineLine&&Math.min(A.x2,B.x2)-Math.max(A.x1,B.x1)>0){
        overlap++; bad.push(`선 겹침: ${nm(E[i])} / ${nm(E[j])} (가로, 간격 ${Math.abs(A.y1-B.y1)})`); }
      else if(s.v&&t.v&&Math.abs(A.x1-B.x1)<GAP.lineLine&&Math.min(A.y2,B.y2)-Math.max(A.y1,B.y1)>0){
        overlap++; bad.push(`선 겹침: ${nm(E[i])} / ${nm(E[j])} (세로, 간격 ${Math.abs(A.x1-B.x1)})`); }
      else if(s.h!==t.h){ const H_=s.h?A:B, V_=s.h?B:A;
        if(V_.x1>H_.x1&&V_.x1<H_.x2&&H_.y1>V_.y1&&H_.y1<V_.y2) cross++; }
    }
  // 2. 선이 남의 블록·남의 묶음을 지나는가
  for(const x of E){
    for(const [si,s] of x.segs.entries()){ const S=segBox(s);
      for(const m of mods){ const own=(m.key===x.e.src&&si===0)||(m.key===x.e.dst&&si===x.segs.length-1);
        if(own) continue;
        if(hit(grow(S,0.5),R(rectOf(m.key),m.key===x.e.src||m.key===x.e.dst?0:GAP.lineNode))){
          lineHit++; bad.push(`선이 블록을 지남: ${nm(x)} ↔ ${label(m.key)}`); } }
      for(const g in groups){ const b=groups[g];
        if(b.mods.includes(x.e.src)||b.mods.includes(x.e.dst)) continue;
        if(hit(grow(S,0.5),R(b,GAP.lineBox))){ lineHit++; bad.push(`선이 묶음을 지남/스침: ${nm(x)} ↔ ${g}`); } }
      for(const g in groups){ const t=groups[g].title;
        if(hit(grow(S,0.5),R(t,4))){ lineHit++; bad.push(`선이 묶음 제목을 지남: ${nm(x)} ↔ ${g}`); } }
    }
  }
  // 3. 라벨
  const L=E.map(x=>({x,r:R(x.lab)}));
  for(let i=0;i<L.length;i++){
    for(let j=i+1;j<L.length;j++) if(hit(grow(L[i].r,GAP.labLab/2),grow(L[j].r,GAP.labLab/2))){
      labGap++; bad.push(`라벨 간격 부족: ${nm(L[i].x)} / ${nm(L[j].x)}`); }
    for(const y of E) for(const s of y.segs) if(hit(grow(segBox(s),0.5),grow(L[i].r,GAP.labLine))){
      labHit++; bad.push(`라벨이 선에 닿음: [${nm(L[i].x)}] ↔ ${nm(y)}`); break; }
    for(const m of mods) if(hit(L[i].r,R(rectOf(m.key),GAP.labNode))){
      labHit++; bad.push(`라벨이 블록에 닿음: [${nm(L[i].x)}] ↔ ${label(m.key)}`); }
    for(const g in groups){ const b=R(groups[g]), r=L[i].r;
      const inside=r.x1>=b.x1&&r.x2<=b.x2&&r.y1>=b.y1&&r.y2<=b.y2;
      if(hit(r,grow(b,GAP.labNode))&&!(inside&&hit(r,grow(b,-GAP.labNode))&&
         r.x1>=b.x1+GAP.labNode&&r.x2<=b.x2-GAP.labNode&&r.y1>=b.y1+GAP.labNode&&r.y2<=b.y2-GAP.labNode)){
        labHit++; bad.push(`라벨이 묶음 테두리에 닿음: [${nm(L[i].x)}] ↔ ${g}`); }
      if(hit(r,R(groups[g].title,GAP.labNode))){ labHit++; bad.push(`라벨이 묶음 제목에 닿음: [${nm(L[i].x)}] ↔ ${g}`); } }
  }
  // 4. 같은 블록 같은 변에 붙는 선끼리 간격
  const ends=[];
  for(const x of E){ const r=ROUTE[ekey(x.e)];
    ends.push({k:x.e.src,side:r.s[0],c:r.s[1],x}); ends.push({k:x.e.dst,side:r.d[0],c:r.d[1],x}); }
  for(let i=0;i<ends.length;i++) for(let j=i+1;j<ends.length;j++){ const a=ends[i], b=ends[j];
    if(a.k===b.k&&a.side===b.side&&Math.abs(a.c-b.c)<GAP.port){
      port++; bad.push(`접점 간격 부족: ${label(a.k)} ${a.side}변 (${nm(a.x)} / ${nm(b.x)})`); } }
  // 5. 블록 글자가 넘치는가 · 대각선 · 배치 누락
  for(const m of mods){ const r=rectOf(m.key);
    if(24+tw(m.label,12.5)+10>r.w){ other++; bad.push(`블록 글자 넘침: ${m.label}`); } }
  for(const x of E) if(x.segs.some(s=>!s.h&&!s.v)){ other++; bad.push(`직각이 아닌 구간: ${nm(x)}`); }
  for(const k of missingN){ other++; bad.push(`배치표에 없는 모듈: ${k}`); }
  for(const k of missingR){ other++; bad.push(`배치표에 없는 연결: ${k}`); }

  // 화면에는 싣지 않는다(PM 결정) — 배치를 고칠 때 콘솔·window.__audit 로 본다.
  window.__audit={overlap,cross,labGap,labHit,lineHit,port,other,bad};
  if(bad.length) console.warn('[배치 검사]', bad);
}

/* ── 연결 목록 ───────────────────────────────────────────── */
const STATUS_KO={fixed:'확정', undefined:'미정', mismatch:'불일치'};
function drawEdgeTable(){
  const feat=featSet(), fk=focusMod();
  const rows=REG.edges.filter(e=>shown(e.src)&&shown(e.dst));
  const bad=rows.filter(e=>e.status!=='fixed').length;
  $('edgecount').textContent=`— ${rows.length}개 중 확정 ${rows.length-bad} · 확인 필요 ${bad}`;
  $('edgerows').innerHTML=rows.map(e=>{
    const off=(fk&&e.src!==fk&&e.dst!==fk)||(!fk&&feat&&!(feat.has(e.src)&&feat.has(e.dst)));
    const lit=fk&&(e.src===fk||e.dst===fk);
    return `<tr class="row ${off?'faded':''} ${lit?'lit':''}"
      onmouseenter="hoverEdge='${e.src}>${e.dst}';applyState()"
      onmouseleave="hoverEdge=null;applyState()"
      onclick="togglePin('${e.src}')">
      <td>${esc(label(e.src))}</td><td class="arrow">→</td><td>${esc(label(e.dst))}</td>
      <td class="pay">${esc(e.payload)}</td>
      <td><span class="st ${e.status}">${STATUS_KO[e.status]}</span></td>
      <td class="pay">${esc(e.contract||'—')}</td>
      <td class="note">${esc(e.note||'')}</td></tr>`;
  }).join('');
}

/* ── 기능 ─────────────────────────────────────────────────── */
function drawFeatures(){
  $('featlist').innerHTML=REG.features.map(f=>`
    <button class="feat" data-k="${f.key}" title="${esc(f.entry)}" onclick="pickFeature('${f.key}')">
      ${esc(f.label)}<small>${f.modules.length}</small></button>`).join('');
}
function pickFeature(k){
  selFeature=(k&&k!==selFeature)?k:null; pinMod=null; hoverMod=null;
  document.querySelectorAll('.feat').forEach(b=>b.classList.toggle('sel',b.dataset.k===selFeature));
  const f=REG.features.find(x=>x.key===selFeature);
  $('maptitle').textContent=f?`전체 흐름 — ${f.label}`:'전체 흐름';
  if(f&&f.modules.some(m=>ORAL.has(m))&&hideOral){ hideOral=false; syncOral(); build(); }
  applyState(); drawEdgeTable();
}
function reset(){ selFeature=null; pinMod=null; hoverMod=null; selTrace=null;
  document.querySelectorAll('.feat').forEach(b=>b.classList.remove('sel'));
  $('maptitle').textContent='전체 흐름'; applyState(); drawEdgeTable(); drawTraces(); drawEvents(); }
function toggleOral(){ hideOral=!hideOral; syncOral(); build(); drawEdgeTable(); }
function syncOral(){ const b=$('btnOral');
  b.textContent=hideOral?'음독 숨김':'음독 표시'; b.classList.toggle('on',!hideOral); }

/* ── 실행 기록 ────────────────────────────────────────────── */
function drawTraces(){
  const cur=(activeTrace()||{}).id;
  $('traces').innerHTML=TRACES.slice(0,12).map(t=>`
    <span class="tchip ${t.id===cur?'sel':''} ${t.events.length?'':'nil'}"
      onclick="pickTrace('${t.id}')">${esc(t.label)} · ${t.events.length}건${t.done?'':' …'}</span>`
  ).join('')||'<span class="empty">기록 없음</span>';
}
function pickTrace(id){ selTrace=id; drawTraces(); drawEvents(); applyState(); }
function drawEvents(){
  const t=activeTrace(); if(!t) return;
  $('tmeta').textContent=` · ${t.label} (${t.ms}ms, 모듈 ${t.modules.length}개`
    +(t.session_id?`, 세션 ${t.session_id}`:'')+')';
  if(!t.events.length){
    $('events').innerHTML='<div class="empty">이 요청은 서비스 모듈을 거치지 않았습니다.</div>'; return; }
  $('events').innerHTML=t.events.map(e=>{
    const ins=Object.entries(e.args).map(([k,v])=>
      `<div class="io"><b>IN</b> ${esc(k)} = ${esc(v)}</div>`).join('');
    const out=e.error?`<div class="io"><b class="err">ERR</b> ${esc(e.error)}</div>`
                     :`<div class="io"><b>OUT</b> ${esc(e.ret??'-')}</div>`;
    return `<div class="ev" style="margin-left:${e.depth*14}px">
      <div class="ev-h"><span class="m">${esc(e.module.split('.').pop())}</span>.${esc(e.fn)}
      <span class="ms">${e.ms}ms</span></div>${ins}${out}</div>`;
  }).join('');
}
function apply(d){ TRACES=d.traces||[]; drawTraces(); drawEvents(); applyState(); }
function connect(){
  const es=new EventSource('stream');
  es.onopen=()=>{ $('live').textContent='실시간'; $('live').className='live on'; };
  es.onmessage=(m)=>apply(JSON.parse(m.data));
  es.onerror=()=>{ $('live').textContent='끊김 — 폴링'; $('live').className='live'; es.close();
    setInterval(async()=>apply(await (await fetch('traces')).json()),2000); };
}
async function clearTraces(){ await fetch('traces',{method:'DELETE'}); selTrace=null; apply({traces:[]}); }
boot();
</script>
