<!DOCTYPE html>
<!--
  STRIPE 모듈 흐름 대시보드 — 로컬 개발 전용

  설계 의도
  · 모듈을 진행 순서대로 왼→오른쪽 열에 배치하고 **화살표로 잇는다.**
    블록만 나열하면 무엇이 무엇에 연결되는지 알 수 없다.
  · 화살표에 **무엇이 오가는지** 적는다. 그리고 그 형식이 확정됐는지를
    색으로 구분한다 — 흐름을 보면서 "어디가 아직 미정인가" 를 같이 읽는다.
  · 기능 버튼을 누르면 그 기능이 쓰는 모듈·연결선만 밝아진다.
  · 실제 요청이 들어오면 호출된 모듈이 켜지고 아래에 오간 형태가 쌓인다.
  · 값은 표시되지 않는다. 타입·개수·키·enum 까지만.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>STRIPE 흐름</title>
<style>
  :root{
    --bg:#0f1117; --panel:#1a1d27; --line:#2a2d3e; --txt:#e6e8ef; --dim:#8b90a3;
    --mint:#4ECDC4; --coral:#FF6B6B; --yellow:#FFE66D; --violet:#9b8cff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.5 "Segoe UI",system-ui,sans-serif}
  header{display:flex;align-items:center;gap:.8rem;padding:.8rem 1.1rem;
         border-bottom:1px solid var(--line)}
  header h1{margin:0;font-size:1.02rem}
  .live{font-size:.73rem;padding:.14rem .5rem;border-radius:99px;
        background:#23283a;color:var(--dim)}
  .live.on{background:rgba(78,205,196,.15);color:var(--mint)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);
               border-radius:6px;padding:.2rem .55rem;font:inherit;font-size:.74rem;
               cursor:pointer}
  button.ghost:hover{color:var(--txt)}
  main{display:grid;grid-template-columns:210px 1fr;gap:.9rem;padding:.9rem 1.1rem;
       align-items:start}
  @media (max-width:980px){main{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:.7rem}
  .card h2{margin:.05rem 0 .5rem;font-size:.77rem;color:var(--dim);
           letter-spacing:.7px;text-transform:uppercase}

  .feat{display:block;width:100%;text-align:left;background:transparent;
        border:1px solid transparent;color:var(--txt);border-radius:7px;
        padding:.42rem .5rem;margin-bottom:.14rem;cursor:pointer;font:inherit}
  .feat:hover{background:#23283a}
  .feat.sel{background:rgba(78,205,196,.12);border-color:var(--mint);color:var(--mint)}
  .feat small{display:block;color:var(--dim);font-size:.7rem}
  .feat.sel small{color:#79b8b2}

  /* 흐름도 */
  #canvas{position:relative;overflow:auto}
  #wire{position:absolute;inset:0;pointer-events:none;overflow:visible}
  .colgrid{position:relative;display:flex;gap:56px;align-items:flex-start;
           padding:.3rem 0 .6rem}
  .col{display:flex;flex-direction:column;gap:10px;min-width:168px}
  .coltitle{font-size:.68rem;color:var(--dim);letter-spacing:.8px;
            text-transform:uppercase;margin-bottom:.1rem}
  .node{position:relative;border:2px solid #262a38;background:#141822;
        border-radius:8px;padding:.42rem .5rem;transition:border-color .15s,
        background .15s,box-shadow .15s,opacity .15s}
  .node .nm{font-size:.81rem;line-height:1.25}
  .node .sub{font-size:.66rem;color:var(--dim);margin-top:.1rem;
             white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .node.dim{opacity:.3}
  .node.inscope{border-color:var(--mint);background:rgba(78,205,196,.07)}
  .node.fired{border-color:var(--yellow);background:rgba(255,230,109,.11);
              box-shadow:0 0 0 3px rgba(255,230,109,.1)}
  .node .cnt{position:absolute;top:-8px;right:-6px;background:var(--yellow);
             color:#20242e;font-size:.63rem;font-weight:800;border-radius:99px;
             padding:.02rem .34rem}
  .purity{display:inline-block;width:6px;height:6px;border-radius:99px;
          margin-right:5px;vertical-align:1px}
  .purity.pure{background:var(--mint)} .purity.mixed{background:var(--yellow)}
  .purity.db{background:var(--coral)}

  /* 연결선 */
  .ln{stroke-width:1.6;fill:none}
  .ln.fixed{stroke:#3c4256}
  .ln.undefined{stroke:var(--violet);stroke-dasharray:5 4}
  .ln.mismatch{stroke:var(--coral);stroke-dasharray:3 3}
  .ln.hot{stroke:var(--yellow);stroke-width:2.6}
  .ln.faded{opacity:.14}
  .lnlab{font-size:9.5px;fill:#9aa0b4;paint-order:stroke;stroke:#0f1117;
         stroke-width:3px;stroke-linejoin:round}
  .lnlab.undefined{fill:#b3a7ff} .lnlab.mismatch{fill:#ff9b9b}
  .lnlab.faded{opacity:.14}

  .legend{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.71rem;color:var(--dim);
          margin-top:.2rem}
  .legend i{display:inline-block;width:16px;height:0;border-top-width:2px;
            border-top-style:solid;margin-right:4px;vertical-align:3px}

  /* 흐름 패널 */
  .traces{display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem}
  .tchip{font-size:.71rem;padding:.2rem .52rem;border-radius:99px;cursor:pointer;
         border:1px solid var(--line);background:#141822;color:var(--dim)}
  .tchip.sel{border-color:var(--mint);color:var(--mint)}
  .tchip.nil{opacity:.45}
  .ev{border-left:2px solid var(--line);padding:.26rem 0 .26rem .65rem}
  .ev-h{font-family:ui-monospace,Consolas,monospace;font-size:.77rem}
  .ev-h .m{color:var(--mint)} .ev-h .ms{color:var(--dim);font-size:.71rem}
  .ev-h .err{color:var(--coral)}
  .io{font-family:ui-monospace,Consolas,monospace;font-size:.71rem;color:var(--dim);
      word-break:break-all}
  .io b{color:#b9c0d4}
  .empty{color:var(--dim);font-size:.79rem;padding:.4rem 0}
  .sub2{font-size:.73rem;color:var(--dim);margin-bottom:.5rem}
  #tip{position:fixed;display:none;max-width:320px;background:#0b0d13;
       border:1px solid var(--line);border-radius:7px;padding:.45rem .6rem;
       font-size:.74rem;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.5)}
  #tip b{color:var(--txt)} #tip .st{font-size:.68rem;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>STRIPE 모듈 흐름</h1>
  <span id="live" class="live">연결 중…</span>
  <span style="flex:1"></span>
  <button class="ghost" onclick="pickFeature(null)">전체 보기</button>
  <button class="ghost" onclick="clearTraces()">기록 비우기</button>
</header>

<main>
  <div class="card">
    <h2>기능</h2>
    <div id="featlist"></div>
  </div>

  <div>
    <div class="card">
      <h2 id="maptitle">전체 흐름</h2>
      <div id="canvas">
        <svg id="wire"></svg>
        <div id="cols" class="colgrid"></div>
      </div>
      <div class="legend">
        <span><span class="purity pure"></span>순수 변환</span>
        <span><span class="purity mixed"></span>혼재</span>
        <span><span class="purity db"></span>DB 전담</span>
        <span><i style="border-color:#3c4256"></i>형식 확정</span>
        <span><i style="border-color:#9b8cff;border-top-style:dashed"></i>형식 미정</span>
        <span><i style="border-color:#FF6B6B;border-top-style:dashed"></i>두 곳이 다름</span>
        <span><i style="border-color:#FFE66D"></i>방금 실행됨</span>
      </div>
    </div>

    <div class="card" style="margin-top:.9rem">
      <h2>주고받은 데이터</h2>
      <div class="sub2">값은 기록하지 않습니다 — 타입·개수·키·enum 까지만.<span id="tmeta"></span></div>
      <div id="traces" class="traces"></div>
      <div id="events"><div class="empty">아직 요청이 없습니다. 로컬에서 진단을 실행하면 흐름이 쌓입니다.</div></div>
    </div>
  </div>
</main>
<div id="tip"></div>

<script>
let REG=null, TRACES=[], selFeature=null, selTrace=null;
const $=(id)=>document.getElementById(id);
const esc=(s)=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

async function boot(){
  REG = await (await fetch('registry')).json();
  drawFeatures(); drawNodes(); requestAnimationFrame(drawWires); connect();
  addEventListener('resize', ()=>requestAnimationFrame(drawWires));
  $('canvas').addEventListener('scroll', ()=>requestAnimationFrame(drawWires));
}

function drawFeatures(){
  $('featlist').innerHTML = REG.features.map(f=>`
    <button class="feat" data-k="${f.key}" onclick="pickFeature('${f.key}')">
      ${f.label}<small>${f.modules.length}개 모듈</small></button>`).join('');
}
function pickFeature(k){
  selFeature = (k && k!==selFeature) ? k : null;
  document.querySelectorAll('.feat').forEach(b=>
    b.classList.toggle('sel', b.dataset.k===selFeature));
  const f = REG.features.find(x=>x.key===selFeature);
  $('maptitle').textContent = f ? `전체 흐름 — ${f.label}` : '전체 흐름';
  drawNodes(); requestAnimationFrame(drawWires);
}

const scopeSet=()=>{
  const f=REG.features.find(x=>x.key===selFeature);
  return f ? new Set(f.modules) : null;         // null = 전체 보기
};
/** 지금 볼 추적. 고른 게 없으면 **모듈을 실제로 거친** 가장 최근 것.
 *
 *  헬스체크처럼 서비스 모듈을 안 거치는 요청이 마지막이면 지도가 통째로
 *  비어 보인다. 그걸 '동작 안 함'으로 읽게 되므로, 흐름이 있는 것을 고른다. */
function activeTrace(){
  if(selTrace) return TRACES.find(x=>x.id===selTrace);
  return TRACES.find(t=>t.events.length) || TRACES[0];
}
function firedMap(){
  const t=activeTrace();
  const m=new Map();
  if(t) for(const e of t.events) m.set(e.module,(m.get(e.module)||0)+1);
  return m;
}

function drawNodes(){
  const scope=scopeSet(), fired=firedMap();
  $('cols').innerHTML = REG.cols.map(c=>{
    const mods=REG.modules.filter(m=>m.col===c);
    return `<div class="col"><div class="coltitle">${REG.col_names[c]||('col '+c)}</div>`
      + mods.map(m=>{
        const cls=['node'];
        if(scope && !scope.has(m.key)) cls.push('dim');
        if(scope && scope.has(m.key)) cls.push('inscope');
        if(fired.has(m.key)) cls.push('fired');
        const n=fired.get(m.key);
        return `<div class="${cls.join(' ')}" id="n-${cssid(m.key)}" data-k="${m.key}">
          ${n?`<span class="cnt">${n}</span>`:''}
          <div class="nm"><span class="purity ${m.purity}"></span>${m.label}</div>
          <div class="sub">${m.outputs.length?m.outputs[0]:m.key}</div></div>`;
      }).join('') + `</div>`;
  }).join('');
}
const cssid=(k)=>k.replace(/\./g,'_');

/** 노드 사이를 곡선으로 잇고, 선 위에 오가는 것을 적는다. */
function drawWires(){
  const svg=$('wire'), box=$('canvas').getBoundingClientRect();
  svg.setAttribute('width', $('cols').scrollWidth);
  svg.setAttribute('height', $('cols').scrollHeight);
  const scope=scopeSet(), fired=firedMap();
  const parts=[`<defs>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.2"
            orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#4b5169"/></marker>
    <marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.2"
            orient="auto"><path d="M0,0 L7,3.2 L0,6.4 z" fill="#FFE66D"/></marker>
  </defs>`];

  for(const e of REG.edges){
    const a=$('n-'+cssid(e.src)), b=$('n-'+cssid(e.dst));
    if(!a||!b) continue;
    const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
    const sx=ra.right-box.left+$('canvas').scrollLeft,
          sy=ra.top-box.top+ra.height/2+$('canvas').scrollTop,
          ex=rb.left-box.left+$('canvas').scrollLeft,
          ey=rb.top-box.top+rb.height/2+$('canvas').scrollTop;
    const mx=(sx+ex)/2;
    const hot = fired.has(e.src) && fired.has(e.dst);
    const off = scope && !(scope.has(e.src) && scope.has(e.dst));
    const cls=[ 'ln', e.status, hot?'hot':'', off?'faded':'' ].filter(Boolean).join(' ');
    parts.push(`<path class="${cls}" d="M${sx},${sy} C${mx},${sy} ${mx},${ey} ${ex},${ey}"
                 marker-end="url(#${hot?'ah':'a'})"></path>`);
    // 선 위 라벨 — 길면 자르고 전체는 마우스를 올리면 보인다
    const short = e.payload.length>30 ? e.payload.slice(0,29)+'…' : e.payload;
    parts.push(`<text class="lnlab ${e.status} ${off?'faded':''}"
      x="${mx}" y="${(sy+ey)/2-4}" text-anchor="middle"
      onmousemove="tip(evt, this)" onmouseleave="untip()"
      data-p="${esc(e.payload)}" data-s="${e.status}" data-n="${esc(e.note||'')}"
      style="pointer-events:auto;cursor:help">${esc(short)}</text>`);
  }
  svg.innerHTML=parts.join('');
}

const STATUS_KO={fixed:'형식 확정', undefined:'형식이 적힌 곳이 없다',
                 mismatch:'두 곳에서 다르게 정의돼 있다'};
function tip(evt, el){
  const t=$('tip');
  t.innerHTML=`<b>${el.dataset.p}</b><div class="st">${STATUS_KO[el.dataset.s]}</div>`
    + (el.dataset.n?`<div class="st" style="margin-top:.3rem">${el.dataset.n}</div>`:'');
  t.style.display='block';
  t.style.left=Math.min(evt.clientX+12, innerWidth-340)+'px';
  t.style.top=(evt.clientY+14)+'px';
}
const untip=()=>$('tip').style.display='none';

function drawTraces(){
  const cur=(activeTrace()||{}).id;
  $('traces').innerHTML = TRACES.slice(0,12).map(t=>`
    <span class="tchip ${t.id===cur?'sel':''} ${t.events.length?'':'nil'}"
          onclick="pickTrace('${t.id}')">
      ${esc(t.label)} · ${t.events.length}건${t.done?'':' …'}</span>`).join('')
    || '<span class="empty">기록 없음</span>';
}
function pickTrace(id){ selTrace=id; drawTraces(); drawEvents(); drawNodes();
                        requestAnimationFrame(drawWires); }

function drawEvents(){
  const t=activeTrace();
  if(!t){ return; }
  $('tmeta').textContent = ` · ${t.label} (${t.ms}ms, 모듈 ${t.modules.length}개`
    + (t.session_id?`, 세션 ${t.session_id}`:'') + ')';
  if(!t.events.length){
    $('events').innerHTML='<div class="empty">이 요청은 서비스 모듈을 거치지 않았습니다.</div>';
    return;
  }
  $('events').innerHTML = t.events.map(e=>{
    const ins=Object.entries(e.args).map(([k,v])=>
      `<div class="io"><b>IN</b> ${esc(k)} = ${esc(v)}</div>`).join('');
    const out=e.error
      ? `<div class="io"><b class="err">ERR</b> ${esc(e.error)}</div>`
      : `<div class="io"><b>OUT</b> ${esc(e.ret??'-')}</div>`;
    return `<div class="ev" style="margin-left:${e.depth*14}px">
      <div class="ev-h"><span class="m">${esc(e.module.split('.').pop())}</span>.${esc(e.fn)}
      <span class="ms">${e.ms}ms</span></div>${ins}${out}</div>`;
  }).join('');
}

function apply(d){
  TRACES=d.traces||[];
  drawTraces(); drawEvents(); drawNodes(); requestAnimationFrame(drawWires);
}
function connect(){
  const es=new EventSource('stream');
  es.onopen=()=>{ $('live').textContent='실시간'; $('live').className='live on'; };
  es.onmessage=(m)=>apply(JSON.parse(m.data));
  es.onerror=()=>{
    $('live').textContent='끊김 — 폴링'; $('live').className='live'; es.close();
    setInterval(async()=>apply(await (await fetch('traces')).json()), 2000);
  };
}
async function clearTraces(){
  await fetch('traces',{method:'DELETE'}); selTrace=null; apply({traces:[]});
}
boot();
</script>
</body>
</html>
